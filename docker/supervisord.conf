[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid

[program:api]
command=python -m uvicorn npc_engine.main_fast_ent:app --host 0.0.0.0 --port 8001 --log-level info
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/app/logs/api.log
stdout_logfile_maxbytes=20MB
stderr_logfile=/app/logs/api.log
stderr_logfile_maxbytes=20MB
environment=PYTHONUNBUFFERED="1"

[program:ui]
command=python -m streamlit run social_webui_ent.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true --server.fileWatcherType=none
directory=/app
autostart=true
autorestart=true
startretries=3
; Give the API a few seconds to start before Streamlit makes its first call
startsecs=5
stdout_logfile=/app/logs/ui.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/app/logs/ui.log
stderr_logfile_maxbytes=10MB
environment=PYTHONUNBUFFERED="1",NPC_API_BASE="http://localhost:8001"
