id: atlas_orcs
type: persona_group
description: "Warriors of the Durotar clan."

concepts:
  - id: cpt_agreement
    type: concept
    name: "Blood Agreement"
  - id: cpt_toll_paid
    type: concept
    name: "Toll Paid"
  - id: cpt_orc_respect
    type: concept
    name: "Warrior Respect"

# Atlas-level hint escalation — all orcs are blunt, never subtle.
# Integer keys — do not quote them.
hint_escalation:
  1:
    header: "ORC INSTINCT"
    directive: "grunt and gesture vaguely — orcs imply, they never explain"
  2:
    header: "WARCHIEF LOGIC"
    directive: "make the point obvious through action or direct demand — stay in character"
  3:
    header: "BLUNT FORCE"
    directive: "state it outright — orc patience has a hard limit and it just ran out"

personas:
  - id: persona_orc_loktar
    type: persona
    name: "Lok'tar the Brave"
    description: "A battle-hardened orc from the Durotar clan. His green skin is crisscrossed with scars, and he wears crude iron pauldrons over leather straps. He carries the weight of many victories and smells of iron, smoke, and strong ale."
    tags: ["orc", "warrior", "aggressive"]
    properties:
      target_social_goal: "ctx_orc_joined"
      behavior_on_enter: "active"
      perform_quest_analysis: true
      use_dynamic_generation: true
      oracle_interpretation: "a primitive, bone-deep instinct—the scent of blood-fate and the roar of ancestors in his ears"

    equipment:
      weapons:
        - id: item_blackrock_axe
          name: "Blackrock Battleaxe"
          pddl_tags: ["axe", "heavy"]
          visual_fragment: "a massive jagged axe stained with the rust of old blood"
      clothes:
        - id: item_durotar_shield
          name: "Durotar Shield"
          pddl_tags: ["shield", "protection"]
          visual_fragment: "a heavy shield bound in dragon-hide with the Durotar insignia"

    behavior_rules:
      - id: act_axe_slam
        mood: angry
        requires_holding_tag: axe
        narrative_template: "roars 'LOK'TAR!', slamming his {item_name} into the floor with splintering force"
      
      - id: act_shield_clash
        mood: angry
        requires_holding_tag: shield
        narrative_template: "drums a massive fist against his {item_name}, creating a deafening metallic thunder"

      - id: act_orc_laugh
        mood: joyful
        narrative_template: "unleashes a guttural, belly-deep laugh that rattles the mugs on the table"

      - id: act_warrior_nod
        mood: neutral
        narrative_template: "gives a short, sharp nod, his hand never leaving the hilt of his weapon"

    contexts:
      - id: ctx_orc_intro
        type: context
        name: "Warrior's Table"
        description: "Lok'tar sits at a scarred wooden table, a half-empty keg of ale at his feet."
        connections:
          - to: ctx_orc_angry
            direction: forward
          - to: ctx_orc_joy
            direction: forward
        properties:
          is_start: true

      - id: ctx_orc_angry
        type: context
        name: "Blood Fury"
        description: "The Orc's eyes turn bloodshot, his tusks bared in a snarl." 
        connections:
          - to: ctx_orc_intro
            direction: backward
        properties:
          is_locked: false
          induces_mood: "angry"

      - id: ctx_orc_joy
        type: context
        name: "Victory Celebration"
        description: "Lok'tar seems impressed by your spirit."
        connections:
          - to: ctx_orc_intro
            direction: backward
        properties:
          is_locked: false
          induces_mood: "joyful"

      - id: ctx_orc_joined
        type: context
        name: "Blood and Honor"
        description: "You have earned a place in his warband."
        connections: []
        properties:
          is_locked: true
          required_concept: cpt_agreement

  - id: persona_grakk
    type: persona
    name: "Grakk Ironjaw"
    description: "A massive orc mercenary with iron-capped tusks and mismatched paladin armor stripped from the battlefield. Blocks the bridge with the casual authority of someone who has never once lost a toll argument."
    tags: ["mercenary", "orc", "tollkeeper"]

    properties:
      target_social_goal: "ctx_grakk_passage"
      behavior_on_enter: "active"
      perform_quest_analysis: false
      use_dynamic_generation: true
      oracle_interpretation: "a sudden smell of iron and old blood, a mercenary's cold appraisal of your coin purse and your spine — in that order"

    equipment:
      weapons:
        - id: item_spiked_club
          name: "Spiked Iron Club"
          pddl_tags: ["club", "heavy"]
          visual_fragment: "a massive iron club studded with salvaged paladin shield-bolts"
      clothes:
        - id: item_salvaged_plate
          name: "Salvaged Paladin Plate"
          pddl_tags: ["armor", "heavy"]
          visual_fragment: "mismatched plate armor with faded holy symbols — clearly taken from someone who no longer needed it"

    behavior_rules:
      - id: act_club_tap
        mood: neutral
        requires_holding_tag: heavy
        narrative_template: "taps {item_name} against the stone railing — a rhythmic, patient warning"

      - id: act_toll_stare
        mood: neutral
        requires_empty_hands: true
        narrative_template: "crosses massive arms and fixes you with the flat stare of someone who has absolutely all day"

      - id: act_raise_club
        mood: angry
        requires_holding_tag: club
        narrative_template: "raises {item_name} an inch — not a swing, not yet, but the implication is loud"

    contexts:
      - id: ctx_grakk_block
        type: context
        name: "Bridge Blocked"
        description: "Grakk sits on the railing of the narrow bridge, spiked club across his knees. The bridge is not wide enough to go around him."
        connections:
          - to: ctx_grakk_deal
            direction: forward
          - to: ctx_grakk_growl
            direction: forward
        properties:
          is_start: true
          induces_mood: "neutral"

      - id: ctx_grakk_deal
        type: context
        name: "Toll Negotiation"
        description: "Grakk slides off the railing and holds out a scarred hand. 'Toll. Bridge not free. Nothing in this realm free.'"
        connections:
          - to: ctx_grakk_passage
            direction: forward
          - to: ctx_grakk_growl
            direction: forward
        properties:
          is_locked: false
          induces_mood: "neutral"

      - id: ctx_grakk_growl
        type: context
        name: "Orc Displeasure"
        description: "Grakk takes one very deliberate step forward. The bridge stones crack slightly under his weight."
        connections:
          - to: ctx_grakk_deal
            direction: forward
        properties:
          is_locked: false
          induces_mood: "angry"

      - id: ctx_grakk_passage
        type: context
        name: "Passage Granted"
        description: "Grakk grunts, pockets whatever you offered, and steps aside with theatrical slowness. 'Smart. Grakk like smart ones. They live longer.'"
        connections: []
        properties:
          is_locked: true
          required_concept: cpt_toll_paid
          induces_mood: "neutral"

    triggers:
      - id: trig_offer_shadow_coin
        type: trigger
        name: "Offer Black Iron Coin"
        parent_context: ctx_grakk_deal
        yields: cpt_toll_paid
        requires_item: item_shadow_coin
        prompt_hint: "That heavy black coin in your pack — shadow iron. Grakk's eyes go straight to it. Coin speaks where words fail."
        properties:
          requires_shared_items: ["item_shadow_coin"]

      - id: trig_show_mighty_blade
        type: trigger
        name: "Show the Mighty Blade"
        parent_context: ctx_grakk_deal
        yields: cpt_toll_paid
        requires_item: mighty_blade
        prompt_hint: "He keeps glancing at your weapon. A warrior's toll is paid in steel — or at least the sight of it. Show him what you carry."
