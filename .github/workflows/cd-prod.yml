name: CD-Prod

on:
  push:
    branches:
      - Prod
  workflow_dispatch:

concurrency:
  group: cd-prod
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_sha: ${{ steps.meta.outputs.image_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "image_sha=${IMAGE_NAME}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:prod-latest
            ${{ steps.meta.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Deploy on server (single container)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script_stop: true
          envs: IMAGE_NAME
          script: |
            set -euo pipefail

            APP_DIR="/opt/daqs"
            CONTAINER_NAME="daqs"
            IMAGE="${{ needs.build-and-push.outputs.image_sha }}"

            mkdir -p "$APP_DIR"

            if [ ! -f "$APP_DIR/player_state.json" ]; then
              echo '{"id":"player_001","location":"forest_entrance","inventory":{"items":{}},"goal":null}' > "$APP_DIR/player_state.json"
            fi

            cat > "$APP_DIR/.env" <<'EOF'
            ${{ secrets.PROD_ENV_FILE }}
            EOF

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker pull "$IMAGE"

            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
            docker volume create daqs_static >/dev/null
            docker volume create daqs_logs >/dev/null

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --env-file "$APP_DIR/.env" \
              -e NPC_API_BASE=http://localhost:8001 \
              -e PYTHONUNBUFFERED=1 \
              -p 8001:8001 \
              -p 8501:8501 \
              -v "$APP_DIR/player_state.json:/app/player_state.json" \
              -v daqs_static:/app/static \
              -v daqs_logs:/app/logs \
              "$IMAGE"

            for i in $(seq 1 30); do
              if curl -fsS "http://localhost:8001/health" >/dev/null 2>&1; then
                echo "Deployment successful"
                exit 0
              fi
              sleep 2
            done

            echo "Healthcheck failed after deploy"
            docker logs "$CONTAINER_NAME" --tail 200 || true
            exit 1
