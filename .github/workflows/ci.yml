name: CI

on:
  pull_request:
    branches:
      - main
      - Prod
  push:
    branches-ignore:
      - Prod

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Run focused test suite
        run: |
          pytest -q \
            tests/test_phase0_fixes.py \
            tests/test_phase1_social_state.py \
            tests/test_phase2_compiler.py \
            tests/test_phase3_dialogue_engine.py \
            tests/test_phase4_quest_planner.py \
            tests/test_phase5_pddl.py \
            tests/test_phase6_session_store.py \
            tests/test_phase7_integration.py \
            tests/test_pddl_validation.py

      - name: Build Docker image
        run: docker build -t daqs-ci:${{ github.sha }} .
